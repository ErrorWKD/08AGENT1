      - generic [ref=f18e27]:
        - generic [ref=f18e28]:
          - paragraph [ref=f18e29]: 요즘 SNS만 켜면 여기저기서 챌린지 영상이 쏟아지죠? 친구들이랑 같이 도전해보면 더 재밌는 요즘 10대 사이 인기 챌린지들을 모아봤어요. 오늘 소개하는 챌린지들, 하나쯤은 이미 들어보셨을지도 몰라요!
          - paragraph [ref=f18e30]
          - paragraph [ref=f18e31]: 1. 오늘의 스터디 챌린지
          - paragraph [ref=f18e32]: 책상 정리부터 오늘의 공부 목표까지 짧게 기록하고 인증하는 챌린지예요. 거창한 계획이 아니어도 괜찮아요. "오늘은 수학 문제집 10쪽 풀기"처럼 작은 목표를 세우고 인증샷을 남기면, 며칠만 지나도 꾸준함이 눈에 보여서 뿌듯함이 커져요. 혼자 하기 힘들다면 친구랑 같이 하는 것도 추천!
          - paragraph [ref=f18e33]
          - paragraph [ref=f18e34]: 2. 댄스 챌린지
          - paragraph [ref=f18e35]: 숏폼 영상에서 빠질 수 없는 게 바로 댄스 챌린지죠. 짧은 안무를 따라 추고 영상으로 남기는 건데, 처음엔 어색해도 몇 번 연습하면 금방 익숙해져요. 완벽하게 추지 않아도 괜찮아요. 즐기면서 찍는 게 포인트!
          - paragraph [ref=f18e36]
          - paragraph [ref=f18e37]: 3. 방 꾸미기 챌린지
          - paragraph [ref=f18e38]: 내 방을 조금씩 바꿔가는 과정을 기록하는 챌린지예요. 큰 돈 들이지 않고도 소품 배치만 바꾸거나 포토존을 만들어보는 것만으로 분위기가 확 달라져요. 비포&애프터 사진을 남기면 나중에 보는 재미도 쏠쏠해요.
          - paragraph [ref=f18e39]
          - paragraph [ref=f18e40]: 4. 하루 3줄 일기 챌린지
          - paragraph [ref=f18e41]: 거창한 다이어리 꾸미기가 부담스럽다면, 하루를 딱 세 줄로만 기록하는 챌린지를 추천해요. "오늘 있었던 일 / 느낀 점 / 내일 하고 싶은 것" 이렇게 짧게 남기면 부담 없이 꾸준히 이어갈 수 있어요.
          - paragraph [ref=f18e42]
          - paragraph [ref=f18e43]: 5. 디지털 디톡스 챌린지
          - paragraph [ref=f18e44]: 역설적이게도 SNS에서 가장 화제가 되는 챌린지 중 하나가 바로 '스마트폰 안 보기' 챌린지예요. 하루 중 일정 시간을 정해두고 스마트폰 없이 보내는 건데, 막상 해보면 생각보다 시간이 많이 남는다는 걸 느낄 수 있어요.
          - paragraph [ref=f18e45]
          - paragraph [ref=f18e46]: 이 중에서 여러분이 이미 해본 챌린지가 있나요? 아니면 새롭게 도전해보고 싶은 챌린지가 있다면 댓글로 알려주세요. 작은 챌린지 하나가 하루를 조금 더 특별하게 만들어줄 수 있으니까요!
